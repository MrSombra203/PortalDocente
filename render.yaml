# Render construye la imagen Docker y considera disponible el servicio cuando responde /health/live.
services:
  - type: web
    name: portal-docente
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./PortalDocente/Dockerfile
    dockerContext: ./PortalDocente
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        sync: false
